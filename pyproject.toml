[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "m-studio-windows-intelligence"
version = "0.1.0"
description = "A safe, read-only Windows diagnostics desktop companion."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "psutil>=5.9,<8",
  "PySide6>=6.6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]
packaging = ["pyinstaller>=6,<7"]

[project.scripts]
mstudio = "mstudio.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
