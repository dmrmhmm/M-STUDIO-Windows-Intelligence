name: Windows portable package

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/package-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application and packager
        run: python -m pip install -e ".[packaging]"
      - name: Build portable desktop application
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed --onedir
          --name MStudio-Windows --paths src src/mstudio/__main__.py
      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/MStudio-Windows/* -DestinationPath dist/MStudio-Windows-x64.zip
      - name: Verify portable package
        shell: pwsh
        run: |
          $executable = "dist/MStudio-Windows/MStudio-Windows.exe"
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "Expected portable executable was not produced."
          }
          python -c "import zipfile; archive = zipfile.ZipFile('dist/MStudio-Windows-x64.zip'); assert archive.testzip() is None; assert any(name.lower().endswith('mstudio-windows.exe') for name in archive.namelist()); print('Portable ZIP integrity and executable entry verified.')"
      - uses: actions/upload-artifact@v4
        with:
          name: MStudio-Windows-x64
          path: dist/MStudio-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
